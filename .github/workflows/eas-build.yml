name: EAS Build
on:
  pull_request:
    branches: [release]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Run tests
        run: npm test
      - name: Build on EAS
        id: build
        run: |
          BUILD_OUTPUT=$(eas build --platform android --profile preview --non-interactive --no-wait --json 2>/dev/null)
          echo "$BUILD_OUTPUT"
          BUILD_URL=$(echo "$BUILD_OUTPUT" | jq -r '.buildUrl // "https://expo.dev/accounts/aethelred-cybernetics/projects/shadowlist/builds"')
          echo "build_url=$BUILD_URL" >> $GITHUB_OUTPUT
      - name: Comment build URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `📦 EAS Build ready: ${{ steps.build.outputs.build_url }}`
            })
