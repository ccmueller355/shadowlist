name: CI — Test & Build Docs

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'src/**'
      - 'package.json'
      - 'app.json'
      - '.github/workflows/deploy-docs.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, Lint & Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: gitleaks secrets scan
        run: |
          curl -sL "https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz
          sudo mv gitleaks /usr/local/bin/
          gitleaks detect --source . --verbose --config .gitleaks.toml

      - run: npm ci --legacy-peer-deps

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Verify Expo config
        run: npx expo config --type introspect

      - name: Run Expo Doctor
        run: npx expo-doctor

      - name: Run tests with coverage
        run: npx jest --coverage

      - name: Build VitePress docs (verify build)
        run: npx vitepress build docs

  android-build:
    name: Android Build Verification (Public Quota)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Expo prebuild
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: shadowlist-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
